name: Template Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # toda segunda-feira

jobs:
  sync:
    # O `source-repo` do callable é este próprio repositório, então aqui o sync
    # seria o template consigo mesmo — um no-op agendado toda segunda. O arquivo
    # precisa existir mesmo assim: é ele que é copiado para os repos-filhos.
    if: ${{ github.repository != 'mri-Qbox-Brasil/script-template' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC do Infisical
    uses: mri-Qbox-Brasil/workflows/.github/workflows/callable-template-sync.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
